<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <title>Mob - 転生したらスライムだった件 MOD Wiki</title>
  <style>
    :root{--bg:#0f172a;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--accent:#2563eb;--accent2:#dbeafe}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7;background:linear-gradient(180deg,#f8fafc 0%,#eef2ff 100%);color:var(--text)}
    header{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;padding:28px 20px}
    .wrap{max-width:1120px;margin:0 auto}
    .hero{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
    .title h1{margin:0 0 8px;font-size:2rem}
    .title p{margin:0;color:#cbd5e1}
    .badge{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);color:#e2e8f0;font-size:.9rem}
    nav{background:#fff;border-bottom:1px solid var(--line)}
    .navwrap{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap}
    .navwrap a{text-decoration:none;color:var(--accent);background:var(--accent2);border:1px solid #bfdbfe;padding:7px 12px;border-radius:999px;font-weight:600}
    main{max-width:1120px;margin:0 auto;padding:20px}
    section{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border:1px solid rgba(229,231,235,.9);border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 8px 20px rgba(15,23,42,.05)}
    h2{margin-top:0}
    table{width:100%;border-collapse:collapse;display:block;overflow-x:auto;background:#fff;border-radius:12px}
    th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;white-space:nowrap}
    th{background:#f8fafc}
    footer{max-width:1120px;margin:0 auto;padding:10px 20px 30px;color:var(--muted);font-size:.92rem}
  </style>
</head>
<body>
  <header><div class="wrap hero"><div class="title"><h1>Mob</h1><p>Mobの一覧と関連情報を整理します。</p><span class="badge">Mobs</span></div><div class="badge"><a href="index.html" style="color:inherit;text-decoration:none;">ホームへ戻る</a></div></div></header>

  <footer>© Tensura MOD Wiki</footer>
