<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>コマンド - 転生したらスライムだった件 MOD Wiki</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.75;background:#f6f7fb;color:#222}
    header,nav,main{max-width:1100px;margin:0 auto;padding:20px}
    header{background:#1f2937;color:#fff}
    nav{background:#fff;border-bottom:1px solid #e5e7eb;display:flex;flex-wrap:wrap;gap:10px}
    nav a{color:#2563eb;text-decoration:none;background:#eff6ff;border:1px solid #dbeafe;border-radius:999px;padding:6px 12px}
    section{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:18px 0}
    table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
    th,td{border:1px solid #ddd;padding:8px 10px;vertical-align:top}
    th{background:#f3f4f6}
    .top{float:right;text-decoration:none}
  </style>
</head>
<body>
  <header id="top">
    <h1>コマンド</h1>
    <p>このページでは、MODの各種コマンドを整理します。</p>
  </header>
  <nav>
    <a href="index.html">ホーム</a>
    <a href="#syntax">記法</a>
    <a href="#ability">能力系</a>
    <a href="#race">種族系</a>
    <a href="#utility">便利系</a>
    <a href="#gamerule">ゲームルール系</a>
  </nav>
  <main>
    <section id="syntax">
      <a class="top" href="#top">▲ 上へ</a>
      <h2>記法</h2>
      <table>
        <thead><tr><th>記号</th><th>意味</th></tr></thead>
        <tbody>
          <tr><td><code>/</code></td><td>選択肢の区切り</td></tr>
          <tr><td><code>( )</code></td><td>入力する内容</td></tr>
          <tr><td><code>[a/b/c]</code></td><td>必須パラメータ</td></tr>
          <tr><td>オレンジ表示</td><td>任意パラメータ</td></tr>
        </tbody>
      </table>
    </section>
    <section id="ability">
      <a class="top" href="#top">▲ 上へ</a>
      <h2>能力系</h2>
      <p>スキルメニュー、収納、融合、創成などに関係するコマンドを整理します。</p>
    </section>
    <section id="race">
      <a class="top" href="#top">▲ 上へ</a>
      <h2>種族系</h2>
      <p>種族変更や進化、再転生に関係するコマンドを整理します。</p>
    </section>
    <section id="utility">
      <a class="top" href="#top">▲ 上へ</a>
      <h2>便利系</h2>
      <p>値確認、進行確認、検索、移動などのコマンドを整理します。</p>
    </section>
    <section id="gamerule">
      <a class="top" href="#top">▲ 上へ</a>
      <h2>ゲームルール系</h2>
      <p>サーバーやワールドの挙動を変える設定系コマンドを整理します。</p>
    </section>
  </main>
</body>
</html>
